name: Local CI/CD Pipeline

on:
  push:
    branches: [ github-action ]
  pull_request:
    branches: [ github-action ]

env:
  DOCKER_IMAGE: nirmal1611/nodejs-k8s-demo
  K8S_NAMESPACE: nodejs-app

jobs:
  build-and-test:
    name: Build and Test
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      working-directory: ./app
      run: npm ci
    
    - name: Run tests
      working-directory: ./app
      run: npm test

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
    - name: Build Docker image
      working-directory: ./app
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:latest .
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
    
    - name: Push Docker image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}:latest
        docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
    
    - name: Logout from Docker Hub
      if: always()
      run: docker logout

  deploy-to-minikube:
    name: Deploy to Local Minikube
    runs-on: self-hosted
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/github-action'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check Minikube status
      run: minikube status
    
    - name: Enable Ingress addon
      run: minikube addons enable ingress
    
    - name: Wait for ingress controller
      run: |
        echo "Waiting for ingress-nginx controller..."
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=120s
    
    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
    
    - name: Update deployment image
      run: |
        kubectl set image deployment/nodejs-deployment \
          nodejs-container=${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
          -n ${{ env.K8S_NAMESPACE }} --record || \
        kubectl apply -f k8s/deployment.yaml
    
    - name: Wait for rollout
      run: kubectl rollout status deployment/nodejs-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=3m
    
    - name: Wait for ingress to get address
      run: |
        echo "Waiting for ingress to get address..."
        timeout=60
        while [ $timeout -gt 0 ]; do
          ADDRESS=$(kubectl get ingress nodejs-ingress -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$ADDRESS" ]; then
            echo "Ingress address: $ADDRESS"
            break
          fi
          echo "Waiting... ($timeout seconds left)"
          sleep 5
          timeout=$((timeout - 5))
        done
    
    - name: Update /etc/hosts
      run: |
        MINIKUBE_IP=$(minikube ip)
        echo "Minikube IP: $MINIKUBE_IP"
        
        # Remove old entry if exists
        sudo sed -i '/nodejs-demo.local/d' /etc/hosts
        
        # Add new entry
        echo "$MINIKUBE_IP nodejs-demo.local" | sudo tee -a /etc/hosts
        
        # Verify
        cat /etc/hosts | grep nodejs-demo
    
    - name: Verify deployment
      run: |
        echo "=== Pods ==="
        kubectl get pods -n ${{ env.K8S_NAMESPACE }}
        echo ""
        echo "=== Services ==="
        kubectl get svc -n ${{ env.K8S_NAMESPACE }}
        echo ""
        echo "=== Ingress ==="
        kubectl get ingress -n ${{ env.K8S_NAMESPACE }}
        echo ""
    
    - name: Health check via DNS
      run: |
        echo "Waiting for ingress to be fully ready..."
        sleep 15
        
        echo "Testing via domain: http://nodejs-demo.local/health"
        curl -f http://nodejs-demo.local/health
        
        echo ""
        echo "Testing main endpoint: http://nodejs-demo.local/"
        curl -f http://nodejs-demo.local/
        
        echo ""
        echo "Testing API endpoint: http://nodejs-demo.local/api/info"
        curl -f http://nodejs-demo.local/api/info
        
        echo ""
        echo "All health checks passed via DNS!"